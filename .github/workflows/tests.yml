name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: liberica
          java-version: "21.0.13.1"
          check-latest: true
          cache: maven

      - name: Verify Java version
        run: |
          java -version
          javac -version
          mvn -version

      - name: Verify Java4Shell patch level
        shell: bash
        run: |
          java --version | head -n 1 | grep -E '^openjdk 21\.0\.13\.1([[:space:]]|$)'

      - name: Build and test
        run: mvn -B -U clean package
